name: Desktop Build (student + teacher)

# Builds the Electron desktop apps for macOS (.dmg), Windows (.exe) and
# Linux (.AppImage) on native runners. Trigger manually from the Actions tab,
# or push a tag like `desktop-v1.0.0`.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    # Route every `run:` through bash (Git bash on the Windows runner) so the
    # exact same commands and relative paths behave identically on all three OSes.
    defaults:
      run:
        shell: bash

    # All EXPO_PUBLIC_* config lives here (GitHub injects it natively on every
    # OS — no cross-env / inline-env shell tricks that break on Windows). These
    # are read by `expo export` at build time. Values that locally come from
    # apps/frontend-student/.env (gitignored, so absent on CI):
    #   - the URLs point every build at production (api.ifluent.app);
    #   - Firebase web config + the Pusher/Reverb app key are public by design;
    #   - the login-code is the one real secret, read from a repo secret.
    env:
      EXPO_PUBLIC_API_URL_WEB: https://api.ifluent.app/api/v1
      EXPO_PUBLIC_API_URL: https://api.ifluent.app/api/v1
      EXPO_PUBLIC_REVERB_HOST: api.ifluent.app
      EXPO_PUBLIC_REVERB_PORT: '443'
      EXPO_PUBLIC_REVERB_SCHEME: wss
      EXPO_PUBLIC_REVERB_APP_KEY: cxar16zcqn1j6y4fbprx
      EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyCiL96QEPKkQ1d3I77fMDhnS7u1dSSaMd8
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ifluent-58302.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ifluent-58302
      EXPO_PUBLIC_FIREBASE_SENDER_ID: '856056302811'
      EXPO_PUBLIC_FIREBASE_APP_ID: '1:856056302811:web:f9c55116fe6359f8e310fe'
      EXPO_PUBLIC_SECRET_LOGIN_CODE: ${{ secrets.EXPO_PUBLIC_SECRET_LOGIN_CODE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Student ──────────────────────────────────────────────────────────
      - name: Export student web bundle
        run: npm run build:desktop-web --workspace=@ifluent/frontend-student

      - name: Package student desktop
        working-directory: apps/frontend-student-desktop
        run: npx electron-builder

      # ── Teacher ──────────────────────────────────────────────────────────
      - name: Export teacher web bundle
        run: npm run build:desktop-web --workspace=@ifluent/frontend-teacher

      - name: Package teacher desktop
        working-directory: apps/frontend-teacher-desktop
        run: npx electron-builder

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/frontend-student-desktop/release/*.dmg
            apps/frontend-student-desktop/release/*.exe
            apps/frontend-student-desktop/release/*.AppImage
            apps/frontend-teacher-desktop/release/*.dmg
            apps/frontend-teacher-desktop/release/*.exe
            apps/frontend-teacher-desktop/release/*.AppImage
