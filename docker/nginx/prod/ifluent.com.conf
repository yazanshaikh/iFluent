# ═══════════════════════════════════════════════════════════════════════════
#  ifluent.com (+ www) → Landing page (static expo web export → apps/landing/dist)
#  Public + indexable.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name ifluent.com www.ifluent.com;

    root /var/www/landing;
    index index.html;
    charset utf-8;

    # Certbot http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Expo static export: try the file, a directory, the .html page, then SPA root
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Long cache for fingerprinted assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    error_log  /var/log/nginx/landing.error.log;
    access_log /var/log/nginx/landing.access.log;
}

