# ═══════════════════════════════════════════════════════════════════════════
#  api.ifluent.app → Laravel API (php-fpm)  +  Reverb websocket (/app)
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name api.ifluent.app;

    root /var/www/backend/public;
    index index.php;
    charset utf-8;

    # Generous body size — payment receipts, student contracts, lesson PDFs
    client_max_body_size 50M;

    # Certbot http-01 challenge (keep BEFORE the redirect you add after SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Reverb websocket (realtime). Reverb's default path is /app ──
    # Resolve the upstream lazily via Docker's embedded DNS (127.0.0.11) so nginx
    # still boots if the reverb container is momentarily down.
    location /app {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # ── Laravel front controller ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        include fastcgi_params;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Deny dotfiles (except ACME)
    location ~ /\.(?!well-known).* { deny all; }

    error_log  /var/log/nginx/api.error.log;
    access_log /var/log/nginx/api.access.log;
}

# ═══════════════════════════════════════════════════════════════════════════
#  HTTPS — enable AFTER issuing the cert:
#    certbot certonly --webroot -w /var/www/certbot -d api.ifluent.app
#  then uncomment below and add `return 301 https://$host$request_uri;` to the
#  port-80 server (keeping the ACME location above it).
