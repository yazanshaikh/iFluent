# ═══════════════════════════════════════════════════════════════════════════
#  crm.ifluent.app → CRM dashboard (static SPA from apps/frontend-crm/dist)
#  PRIVATE: blocked from search engines + ready-to-enable IP allowlist.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name crm.ifluent.app;

    root /var/www/crm;
    index index.html;
    charset utf-8;
    client_max_body_size 50M;

    # Certbot http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Keep the internal CRM out of Google / all crawlers ──
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # ── IP ALLOWLIST (recommended for an internal tool) ──
    # Uncomment and replace with your office / VPN IPs to lock the CRM down so
    # only trusted networks can even reach it. Leave commented to allow all.
    #   allow 203.0.113.10;        # مثال: IP المكتب الثابت
    #   allow 203.0.113.0/24;      # مثال: نطاق شبكة
    #   deny  all;

    # ── Optional 2nd layer: HTTP Basic Auth ──
    # Create the file with:  htpasswd -c docker/nginx/prod/.htpasswd admin
    #   auth_basic           "iFluent CRM — Restricted";
    #   auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    # Hard block for crawlers even if one ignores the header
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # SPA routing — every unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for fingerprinted build assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    error_log  /var/log/nginx/crm.error.log;
    access_log /var/log/nginx/crm.access.log;
}

